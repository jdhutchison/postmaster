# Versions
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.40.1.1
quarkusPluginVersion=3.40.1.1
kotlinVersion=2.4.10
mapstructVersion=1.6.3
commonmarkVersion=0.30.1
greenmailVersion=2.1.14
wiremockVersion=3.13.2
playwrightVersion=1.64.0

# Two Gradle builds (builder and tester) run at the same time on a 15 GB
# machine, so keep each daemon modest
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.caching=false
kapt.include.compile.classpath=false
