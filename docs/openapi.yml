---
openapi: 3.1.0
components:
  schemas:
    ApplicationInfo:
      type: object
      required:
      - name
      - version
      - commit
      - builtAt
      - startedAt
      - uptime
      - uptimeSeconds
      properties:
        name:
          type: string
        version:
          type: string
        commit:
          type:
          - string
          - "null"
        builtAt:
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        startedAt:
          $ref: "#/components/schemas/Instant"
        uptime:
          type: string
        uptimeSeconds:
          type: integer
          format: int64
    CheckStatus:
      type: string
      enum:
      - UP
      - WARN
      - DOWN
    DependencyCheck:
      type: object
      required:
      - status
      - critical
      - componentType
      - target
      - responseTimeMs
      - output
      properties:
        status:
          $ref: "#/components/schemas/CheckStatus"
        critical:
          type: boolean
        componentType:
          type: string
        target:
          type:
          - string
          - "null"
        responseTimeMs:
          type: integer
          format: int64
        output:
          type:
          - string
          - "null"
    DraftCheck:
      type: object
      properties:
        componentId:
          type:
          - string
          - "null"
        componentType:
          type: string
        observedValue:
          type: integer
          format: int64
        observedUnit:
          type: string
        status:
          type: string
        time:
          $ref: "#/components/schemas/Instant"
        output:
          type:
          - string
          - "null"
      required:
      - componentType
      - observedValue
      - observedUnit
      - status
      - time
    DraftHealthReport:
      type: object
      required:
      - status
      - version
      - releaseId
      - serviceId
      - description
      - checks
      properties:
        status:
          type: string
        version:
          type: string
        releaseId:
          type: string
        serviceId:
          type: string
        description:
          type: string
        output:
          type:
          - string
          - "null"
        checks:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/DraftCheck"
    HealthReport:
      type: object
      required:
      - status
      - time
      - application
      - processing
      - checks
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        time:
          $ref: "#/components/schemas/Instant"
        application:
          $ref: "#/components/schemas/ApplicationInfo"
        processing:
          anyOf:
          - $ref: "#/components/schemas/ProcessingInfo"
          - type: "null"
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DependencyCheck"
    HealthStatus:
      type: string
      enum:
      - OK
      - DEGRADED
      - DOWN
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    ProcessingInfo:
      type: object
      required:
      - inProgress
      - currentRun
      - lastRun
      - lastSuccessAt
      - scheduled
      - nextRunAt
      - pendingEmails
      - failedEmailsLastDay
      properties:
        inProgress:
          type: boolean
        currentRun:
          anyOf:
          - $ref: "#/components/schemas/RunInfo"
          - type: "null"
        lastRun:
          anyOf:
          - $ref: "#/components/schemas/RunInfo"
          - type: "null"
        lastSuccessAt:
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        scheduled:
          type: boolean
        nextRunAt:
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        pendingEmails:
          type: integer
          format: int64
        failedEmailsLastDay:
          type: integer
          format: int64
    RuleFormFields:
      type: object
      properties:
        name:
          type:
          - string
          - "null"
          description: "Rule name; required on create, ignored on update"
        description:
          type:
          - string
          - "null"
          description: Required description
        priority:
          type:
          - string
          - "null"
          description: Whole number of 0 or more; blank means 0
        enabled:
          type:
          - string
          - "null"
          description: true to enable the rule (edit only)
        conditionJoin:
          type:
          - string
          - "null"
          description: "all (every condition must match, AND) or any (one is enough,\
            \ OR); blank means all"
        conditions[i].id:
          type:
          - string
          - "null"
          description: Id of an existing condition
        conditions[i].attribute:
          type:
          - string
          - "null"
          description: "subject, sender, message, events, attachments, bill_url, type\
            \ or link"
        conditions[i].matchType:
          type:
          - string
          - "null"
          description: "is, contains, starts_with, regex, has or is_present"
        conditions[i].test:
          type:
          - string
          - "null"
          description: Value to match; not used for has and is_present
        actions[i].id:
          type:
          - string
          - "null"
          description: Id of an existing action
        actions[i].actionType:
          type:
          - string
          - "null"
          description: "One of the action types, e.g. move or set_type"
        actions[i].destination:
          type:
          - string
          - "null"
          description: "Folder for move (chosen from the scanned folders), address\
            \ for forward_email"
        actions[i].typeId:
          type:
          - string
          - "null"
          description: Type id for set_type
        actions[i].calendarId:
          type:
          - string
          - "null"
          description: Calendar id for create_events (optional) and process_bill
        actions[i].notifications:
          type:
          - string
          - "null"
          description: "Notifications for create_events: durations before the event\
            \ or times of day before its day, e.g. 4h, d-1@20:00"
        actions[i].enabled:
          type:
          - string
          - "null"
          description: true when the action is enabled
    RunInfo:
      type: object
      required:
      - id
      - trigger
      - status
      - startedAt
      - finishedAt
      - emailsFound
      - emailsProcessed
      - emailsFailed
      - error
      properties:
        id:
          type: integer
          format: int64
        trigger:
          type: string
        status:
          type: string
        startedAt:
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        finishedAt:
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        emailsFound:
          type: integer
          format: int32
        emailsProcessed:
          type: integer
          format: int32
        emailsFailed:
          type: integer
          format: int32
        error:
          type:
          - string
          - "null"
tags:
- name: Calendars
  description: Calendars events are added to
- name: Configuration
  description: Settings stored in the database
- name: Emails
  description: Processed emails and actions on them
- name: Pages
- name: Prompts
  description: Prompts used with the LLM
- name: Rules
  description: Classification and action rules
- name: Status
- name: Types
  description: Types email is classified as
paths:
  /mail:
    get:
      summary: Dashboard page
      tags:
      - Pages
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /mail/calendars:
    get:
      summary: Calendars page
      tags:
      - Calendars
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Create a calendar (HTMX)
      tags:
      - Calendars
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - name
              - description
              - colour
              - enabled
              - notificationPeriods
              properties:
                name:
                  type:
                  - string
                  - "null"
                description:
                  type:
                  - string
                  - "null"
                colour:
                  type:
                  - string
                  - "null"
                enabled:
                  type:
                  - string
                  - "null"
                notificationPeriods:
                  type:
                  - string
                  - "null"
        required: true
      responses:
        "200":
          description: "The calendars table, swapped into the page; the dialog closes"
          content:
            text/html:
              schema:
                type: string
        "422":
          description: The form with validation errors
        "400":
          description: Bad Request
  /mail/calendars/new:
    get:
      summary: Form for a new calendar (HTMX fragment that opens the calendar dialog)
      tags:
      - Calendars
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /mail/calendars/{id}:
    put:
      summary: Update a calendar (HTMX)
      tags:
      - Calendars
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - name
              - description
              - colour
              - enabled
              - notificationPeriods
              properties:
                name:
                  type:
                  - string
                  - "null"
                description:
                  type:
                  - string
                  - "null"
                colour:
                  type:
                  - string
                  - "null"
                enabled:
                  type:
                  - string
                  - "null"
                notificationPeriods:
                  type:
                  - string
                  - "null"
        required: true
      responses:
        "200":
          description: "The calendars table, swapped into the page; the dialog closes"
          content:
            text/html:
              schema:
                type: string
        "422":
          description: The form with validation errors
        "404":
          description: No such calendar
        "400":
          description: Bad Request
    delete:
      summary: Delete a calendar (HTMX)
      tags:
      - Calendars
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The calendars table
          content:
            text/html:
              schema:
                type: string
        "404":
          description: No such calendar
  /mail/calendars/{id}/edit:
    get:
      summary: Form for editing a calendar (HTMX fragment that opens the calendar
        dialog)
      tags:
      - Calendars
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No such calendar
  /mail/calendars/{id}/enabled:
    post:
      summary: "Enable or disable a calendar (HTMX); enabled=true enables, anything\
        \ else disables"
      tags:
      - Calendars
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type:
                  - string
                  - "null"
        required: true
      responses:
        "200":
          description: The calendars table
          content:
            text/html:
              schema:
                type: string
        "404":
          description: No such calendar
        "400":
          description: Bad Request
  /mail/configuration:
    get:
      summary: Configuration page
      tags:
      - Configuration
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /mail/configuration/{key}:
    put:
      summary: Update a setting (HTMX fragment)
      description: Validates the value for the setting's type. Encrypted settings
        are encrypted before they are stored; a blank value leaves them unchanged.
      tags:
      - Configuration
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - value
              properties:
                value:
                  type:
                  - string
                  - "null"
        required: true
      responses:
        "200":
          description: The setting's displayed value
          content:
            text/html:
              schema:
                type: string
        "422":
          description: The edit field with the validation error
          content:
            text/html:
              schema:
                type: string
        "404":
          description: No such setting
        "400":
          description: Bad Request
    delete:
      summary: Clear an encrypted setting (HTMX fragment)
      tags:
      - Configuration
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The setting's displayed value
          content:
            text/html:
              schema:
                type: string
        "409":
          description: The setting isn't encrypted
  /mail/configuration/{key}/edit:
    get:
      summary: Field for editing a setting (HTMX fragment)
      tags:
      - Configuration
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The edit field
          content:
            text/html:
              schema:
                type: string
        "404":
          description: No such setting
  /mail/dashboard:
    get:
      summary: The dashboard's contents (HTMX fragment); it polls itself while a run
        is in progress
      tags:
      - Pages
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /mail/emails:
    get:
      summary: Emails page
      description: "Emails received in the last 7 days, or every email with period=all,\
        \ matching any filters, newest first in pages of 50. Dates (yyyy-MM-dd, inclusive)\
        \ replace the 7 days. Type is a type id or 'none'; values that don't parse\
        \ are ignored. Emails that are deleted, moved or done are left out unless\
        \ untracked=true."
      tags:
      - Emails
      parameters:
      - name: action
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      - name: errors
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      - name: from
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      - name: page
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      - name: period
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      - name: response
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      - name: sender
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      - name: status
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      - name: to
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      - name: type
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      - name: untracked
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /mail/emails/{id}:
    get:
      summary: Email detail page
      tags:
      - Emails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No such email
    delete:
      summary: "Delete an email (HTMX): moves it to the trash folder; the email is\
        \ no longer tracked but can still be viewed"
      tags:
      - Emails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: HX-Redirect to the emails page
          content:
            text/html:
              schema:
                type: string
        "502":
          description: The mailbox refused; an error toast says why
        "404":
          description: No such email
        "409":
          description: "The email isn't tracked, so it can't be acted on"
  /mail/emails/{id}/action-items/{itemId}/done:
    post:
      summary: "Mark an action item done, and tick it off in the to-do list if it's\
        \ there (HTMX)"
      tags:
      - Emails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: HX-Redirect back to the email
          content:
            text/html:
              schema:
                type: string
        "404":
          description: No such email or action item
        "502":
          description: The to-do list couldn't be updated; an error toast says why
  /mail/emails/{id}/action-items/{itemId}/event:
    post:
      summary: Make an action item an event (HTMX)
      description: "date (yyyy-MM-dd) is required; time (HH:mm) is optional, all day\
        \ without one; with calendarId the event is added to that calendar. An item\
        \ in the to-do list is removed from it."
      tags:
      - Emails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - date
              - time
              - calendarId
              properties:
                date:
                  type:
                  - string
                  - "null"
                time:
                  type:
                  - string
                  - "null"
                calendarId:
                  type:
                  - string
                  - "null"
        required: true
      responses:
        "200":
          description: HX-Redirect back to the email
          content:
            text/html:
              schema:
                type: string
        "422":
          description: "No date, or no such enabled calendar"
        "409":
          description: "The item is done, or the email isn't tracked"
        "502":
          description: The to-do list or khal failed; an error toast says why
        "400":
          description: Bad Request
    get:
      summary: Form for making an action item an event (HTMX fragment that opens the
        dialog)
      tags:
      - Emails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No such email or action item
  /mail/emails/{id}/action-required:
    post:
      summary: Set (required=true) or clear an email's action required flag (HTMX);
        bills can't need action
      tags:
      - Emails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - required
              properties:
                required:
                  type:
                  - string
                  - "null"
        required: true
      responses:
        "502":
          description: "Refused, e.g. for a bill; an error toast says why"
        "400":
          description: Bad Request
  /mail/emails/{id}/attachments/{attachmentId}:
    get:
      summary: Download an attachment; inline=true shows it in the browser when it
        can be previewed
      tags:
      - Emails
      parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: inline
        in: query
        schema:
          type:
          - string
          - "null"
        required: true
      responses:
        "404":
          description: "No such attachment, or it hasn't been downloaded"
  /mail/emails/{id}/attachments/{attachmentId}/preview:
    get:
      summary: Preview of an attachment (HTMX fragment that opens the preview dialog)
      tags:
      - Emails
      parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: "No such attachment, or it can't be previewed"
  /mail/emails/{id}/done:
    post:
      summary: "Mark an email done (HTMX): its action items are done, no reply is\
        \ needed, and it's no longer tracked"
      tags:
      - Emails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: HX-Redirect back to the email
          content:
            text/html:
              schema:
                type: string
        "409":
          description: The email isn't tracked
        "502":
          description: The to-do list couldn't be updated; an error toast says why
  /mail/emails/{id}/events/{eventId}/action-item:
    post:
      summary: Make an event that isn't in a calendar an action item (HTMX)
      tags:
      - Emails
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: HX-Redirect back to the email
          content:
            text/html:
              schema:
                type: string
        "404":
          description: No such email or event
        "409":
          description: "The event is in a calendar, the email is a bill, or it isn't\
            \ tracked"
        "502":
          description: The to-do list couldn't be written; an error toast says why
  /mail/emails/{id}/events/{eventId}/calendar:
    get:
      summary: Calendar choice for an event (HTMX fragment that opens the event calendar
        dialog)
      tags:
      - Emails
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No such email or event
    post:
      summary: "Put an event in another calendar (HTMX): moved in khal if added, otherwise\
        \ added"
      tags:
      - Emails
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - calendarId
              properties:
                calendarId:
                  type:
                  - string
                  - "null"
        required: true
      responses:
        "200":
          description: HX-Redirect back to the email
          content:
            text/html:
              schema:
                type: string
        "422":
          description: No such enabled calendar
        "502":
          description: khal failed; an error toast says why
        "400":
          description: Bad Request
  /mail/emails/{id}/move:
    get:
      summary: Form for moving an email to another folder (HTMX fragment that opens
        the move dialog)
      tags:
      - Emails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Move an email to another IMAP folder (HTMX)
      tags:
      - Emails
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - folder
              properties:
                folder:
                  type:
                  - string
                  - "null"
        required: true
      responses:
        "200":
