<form id="type-form" class="pm-form" data-testid="type-form" data-pm-dialog-title="{#if form.id}Edit type{#else}New type{/if}" {#if form.id}hx-put="{base}/types/{form.id}"{#else}hx-post="{base}/types"{/if} hx-target="#type-dialog-body">
  <div class="pm-field">
    <label for="type-name">Name</label>
    <input id="type-name" name="name" class="pm-input" value="{form.name}" maxlength="100" autocomplete="off" autofocus{#if form.invalid('name')} aria-invalid="true"{/if}>
    {#fieldError field="name" message=form.error('name') /}
  </div>
  <div class="pm-field">
    <label for="type-description">Description <span class="pm-muted">(optional)</span></label>
    <textarea id="type-description" name="description" class="pm-input" rows="3">{form.description}</textarea>
  </div>
  {#colourField value=form.colour error=form.error('colour') /}
  <div class="pm-dialog__actions">
    <button type="button" class="pm-button" data-pm-close>Cancel</button>
    <button type="submit" class="pm-button pm-button--primary" data-testid="save-type">Save</button>
  </div>
</form>
