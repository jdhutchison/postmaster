# Build-time and default configuration. Deployment-specific values (database
# connection, encryption key, khal config path) come from the YAML file passed
# as the single command line argument; see config/postmaster.example.yml.
quarkus:
  application:
    name: postmaster
  banner:
    enabled: false
  devservices:
    enabled: false
  # Only the "en" locale is needed (dates use Locale.ENGLISH); keeps native images deterministic
  locales: en
  default-locale: en
  native:
    # The version and build time, for the status endpoint, and Jakarta Mail's service files
    # (see MailNativeImage)
    resources:
      includes: build-info.properties,META-INF/services/jakarta.mail.*,META-INF/services/jakarta.activation.spi.*
  http:
    root-path: /mail
    port: 8080
    header:
      # Every asset is served by the application: nothing may load from anywhere else
      Content-Security-Policy:
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'self'; frame-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
      X-Content-Type-Options:
        value: nosniff
      Referrer-Policy:
        value: same-origin
  # Logs go to stdout in every profile, so Docker picks them up. %X is the MDC: the run, email,
  # phase, rule and action being worked on (see docs/architecture.md, "Logging").
  log:
    console:
      enable: true
      stderr: false
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %X %s%e%n"
    file:
      enable: false
  datasource:
    db-kind: mariadb
  hibernate-orm:
    jdbc:
      timezone: UTC
  flyway:
    migrate-at-start: true
    locations: db/migration
    placeholders:
      # Applied to every CREATE TABLE; the collation is the database default.
      # H2 in MariaDB mode accepts these options too.
      table_options: ENGINE=InnoDB DEFAULT CHARSET=utf8mb4
  smallrye-openapi:
    info-title: Postmaster
    info-description: Email processing, classification and actions
    # Written at build time; the openapiSpec Gradle task copies it to docs/openapi.yml
    store-schema-directory: build/openapi

mp:
  openapi:
    # HTML responses are documented as strings, without Qute's internals
    filter: sh.hutch.postmaster.controllers.HtmlResponsesFilter

# Dev mode (./gradlew quarkusDev or bin/dev): an in-memory database filled with fake data by
# config.DevData, so no configuration file, MariaDB, mail server or LLM is needed. The khal
# config and attachment files are written under build/dev/.
"%dev":
  quarkus:
    datasource:
      db-kind: h2
      username: sa
      password: ""
      jdbc:
        # MariaDB mode with case-sensitive identifiers, as in the tests
        url: jdbc:h2:mem:postmaster;MODE=MariaDB;DATABASE_TO_UPPER=FALSE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    hibernate-orm:
      # Dev mode's schema check runs before Flyway has created the tables, and reports them missing
      validate-in-dev-mode: false
  postmaster:
    # Base64 of 32 bytes: a dev-only AES-256 key
    encryption-key: "ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2LTE="
    khal-config: build/dev/khal.ini
    scheduler-enabled: false

# Tests run without scheduled processing; they start runs themselves
"%test":
  postmaster:
    scheduler-enabled: false
